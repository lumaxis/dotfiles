name: dotfiles CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 3 * * 6'

jobs:
  build-docker:
    name: Install in Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build . -t dotfiles

      - name: Run Dockerfile
        run: docker run dotfiles

  build:
    name: Install locally
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Remove existing awscli
      run: |
        rm -f /usr/local/bin/2to3* || true
        rm -f /usr/local/bin/aws || true
        rm -f /usr/local/bin/aws_completer || true
      if: ${{ startsWith(matrix.os, 'macos') }}
    - name: Unlink preinstalled node
      run: brew unlink node@22 || brew unlink node@20 || brew unlink node@18 || brew unlink node@16 || true
      if: ${{ startsWith(matrix.os, 'macos') }}

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Run install command
      run: ./install.sh

    - name: Ensure zsh works
      run: if [[ -n $(HOME=$GITHUB_WORKSPACE zsh -c return) ]]; then exit 1; fi
